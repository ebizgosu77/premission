<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>엔코아 AI 캠퍼스 — 수강생</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>
  <!-- 헤더 -->
  <header class="top-bar">
    <div class="top-bar-left">
      <span class="logo-sm">ENCORE <strong>AI CAMPUS</strong></span>
      <span class="brand-tag">사전미션</span>
    </div>
    <div class="top-bar-right">
      <span class="user-meta" id="userMeta"></span>
      <span class="user-greeting">안녕하세요, <strong id="studentName"></strong>님</span>
      <button id="logoutBtn" class="btn btn-sm btn-outline">로그아웃</button>
    </div>
  </header>

  <!-- 메인 -->
  <main class="dashboard">
    <!-- 전체 진행률 -->
    <section class="overall-progress-section">
      <div class="overall-progress-header">
        <span class="overall-label">전체 진행률</span>
        <span class="overall-value num" id="overallPercent">0%</span>
      </div>
      <div class="overall-bar">
        <div class="overall-bar-fill" id="overallBar" style="width:0%"></div>
      </div>
      <div class="overall-stats">
        <div class="overall-stat">
          <span class="overall-stat-label">수강 완료</span>
          <span class="overall-stat-value num" id="statWatched">0/0</span>
        </div>
        <div class="overall-stat">
          <span class="overall-stat-label">퀴즈 응시 완료</span>
          <span class="overall-stat-value num" id="statQuiz">0/0</span>
        </div>
      </div>
    </section>

    <!-- 탭 -->
    <nav class="tab-nav">
      <div class="tab-list" id="tabList">
        <button class="tab-btn active" data-tab="python">
          <span class="tab-icon">🐍</span> Python 강의
        </button>
        <button class="tab-btn" data-tab="git">
          <span class="tab-icon">🔀</span> Git &amp; GitHub
        </button>
      </div>
      <div class="tab-dropdown" id="tabDropdown">
        <button class="tab-dropdown-btn" id="tabDropdownBtn">
          <span id="tabDropdownLabel">🐍 Python 강의</span>
          <span class="dropdown-arrow">▾</span>
        </button>
        <div class="tab-dropdown-menu" id="tabDropdownMenu">
          <button class="tab-drop-item active" data-tab="python">🐍 Python 강의</button>
          <button class="tab-drop-item" data-tab="git">🔀 Git &amp; GitHub</button>
        </div>
      </div>
    </nav>

    <!-- 탭 콘텐츠 -->
    <section class="tab-content" id="tabContent"></section>
  </main>

  <script src="data/missions.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
